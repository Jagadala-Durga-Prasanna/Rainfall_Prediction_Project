<!DOCTYPE html>
<html>
<head>
    <title>Rainfall Prediction – Indian Agriculture</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;

            background-image: url("/static/home.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .container {
            background-color: lightgray;
            padding: 30px 40px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            width: 360px;
            text-align: center;
        }

        h2 {
            color: #0072ff;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            color: #333;
            display: block;
            text-align: left;
            margin-top: 10px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 8px;
            border: 2px solid #ffa200;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #ff6200;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #00c6ff, #ff7300);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 102, 0, 0.5);
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Rainfall Prediction in Indian Agriculture</h2>
        

        

    <label>JF Rainfall (Jan-Feb)</label>
    <input type="number" id="jf" placeholder="Enter JF rainfall">

    <label>MAM Rainfall (Mar–May)</label>
    <input type="number" id="mam" placeholder="Enter MAM rainfall">

    <label>JJAS Rainfall (Jun–Sep)</label>
    <input type="number" id="jjas" placeholder="Enter JJAS rainfall">

    <label>OND Rainfall (Oct–Dec)</label>
    <input type="number" id="ond" placeholder="Enter OND rainfall">


    <button onclick="analyze()">Predict Rainfall</button>
</div>

<script>
    function analyze() {
        let jf = document.getElementById("jf").value;
        let mam = document.getElementById("mam").value;
        let jjas = document.getElementById("jjas").value;
        let ond = document.getElementById("ond").value;


        if (jf === "" || mam === "" || jjas === "" || ond === "") {
            alert("Please fill all the fields");
            return;
        }

        // Simple EDA-based rule (demo logic)
        let seasonalTotal = Number(jf) + Number(mam) + Number(jjas) + Number(ond);

        if (seasonalTotal >= 25) {
            window.location.href = "/chance";
        } else {
            window.location.href = "/nochance";
        }
    }
</script>

</body>
</html>
