<!DOCTYPE html>
<html>
<head>
    <title>Rainfall Prediction – Indian Agriculture</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;

            background-image: url("/static/home.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .container {
            background-color: lightgray;
            padding: 30px 40px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            width: 360px;
            text-align: center;
        }

        h2 {
            color: #0072ff;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            color: #333;
            display: block;
            text-align: left;
            margin-top: 10px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 8px;
            border: 2px solid #ffa200;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #ff6200;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #00c6ff, #ff7300);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 102, 0, 0.5);
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Rainfall Prediction in Indian Agriculture</h2>
        
    <form action="/predict" method="post">

    <input type="text" name="JF" placeholder="JF Rainfall">
    <input type="text" name="MAM" placeholder="MAM Rainfall">
    <input type="text" name="JJAS" placeholder="JJAS Rainfall">
    <input type="text" name="OND" placeholder="OND Rainfall">

    <button type="submit">Predict Rainfall</button>

</form>
    

</body>
</html>
