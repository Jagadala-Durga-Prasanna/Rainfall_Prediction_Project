<!DOCTYPE html>
<html>
<head>
    <title>Rainfall Prediction</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #00c6ff, #ff00e6);
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            width: 320px;
            text-align: center;
        }

        h2 {
            color: #0072ff;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border-radius: 8px;
            border: 2px solid #ffa200;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #ff6200;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #8c00ff, #ff7300);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 102, 0, 0.5);
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Rainfall Prediction</h2>

    <label>Annual Rainfall:</label><br>
    <input type="number" id="annual" placeholder="Enter rainfall"><br>

    <button onclick="predict()">Predict</button>
</div>

<script>
function predict() {
    let annual = document.getElementById("annual").value;

    if (annual === "") {
        alert("Please enter rainfall value");
        return;
    }

    if (annual > 15) {
        window.location.href = "/chance";
    } else {
        window.location.href = "/nochance";
    }
}
</script>

</body>
</html>
